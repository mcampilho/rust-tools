[package]
name = "rt-dups"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "Finding duplicate files and folders, shared by rdup and rdup-cli"
license = "MIT"
publish = false

[dependencies]
rt-core = { path = "../rt-core" }
rt-scan = { path = "../rt-scan" }
# Hashes of the file contents: fast, and safe against collisions.
blake3 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

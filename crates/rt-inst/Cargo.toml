[package]
name = "rt-inst"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "The programs installed on a computer, read from the registry, Windows Installer, the Store and the Linux package managers; shared by rinst and the privileged service"
license = "MIT"
publish = false

[dependencies]
rt-sys = { path = "../rt-sys" }
rt-scan = { path = "../rt-scan" }
rt-svc = { path = "../rt-svc" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing"] }
# The Store and MSIX packages, which have no Uninstall entry: the package manager of Windows.
windows = { version = "0.62", features = [
    "ApplicationModel",
    "ApplicationModel_Core",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }

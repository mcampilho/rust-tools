[package]
name = "rt-clean"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "What the cleaner cleans: the targets (temporary files, caches, shortcuts, registry entries), measuring them and removing them; shared by rclean and the privileged service"
license = "MIT"
publish = false

[dependencies]
rt-core = { path = "../rt-core" }
rt-sys = { path = "../rt-sys" }
rt-svc = { path = "../rt-svc" }

[target.'cfg(windows)'.dependencies]
# The Recycle Bin (SHQueryRecycleBin, SHEmptyRecycleBin) and deleting only what is where it was listed.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

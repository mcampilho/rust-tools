[package]
name = "rt-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "The window shell shared by the rust-tools apps: window, theme, drawn menus' input, message panel, resident mode, Explorer menu"
license = "MIT"
publish = false

[dependencies]
rt-core = { path = "../rt-core" }
rt-gfx = { path = "../rt-gfx" }
rt-sys = { path = "../rt-sys" }
rt-syntax = { path = "../rt-syntax" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

[dev-dependencies]
# PNG output for the picture test of the Default app panel.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }

# X11 and Wayland both: the same executable runs on either.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[package]
name = "rt-svc"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "The protocol and client of the rust-tools privileged service (see docs/service.md)"
license = "MIT"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

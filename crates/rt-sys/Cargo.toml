[package]
name = "rt-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Windows and Linux integration shared by the rust-tools apps"
license = "MIT"
publish = false

[dependencies]
rt-core = { path = "../rt-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# X11 and Wayland both: the same executable runs on either.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"

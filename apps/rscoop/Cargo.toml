[package]
name = "rscoop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Validates a Scoop installation, finds leftovers of an old Scoop root and repairs them"
license = "MIT"

[package.metadata.rust-tools]
# Read by dev.ps1 and release.yml. `release` unwinds (catch_unwind), `release-small` aborts.
profile = "release-small"

[dependencies]
rt-core = { path = "../../crates/rt-core" }
# Our own cache of what was read from files, and Scoop's own scoop.db.
# Bundled: no SQLite library is needed on the machine.
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

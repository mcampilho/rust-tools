[package]
name = "rpad"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A portable, fast text and code editor"
license = "MIT"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
ropey = "1.6"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }

[dev-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
debug-assertions = false


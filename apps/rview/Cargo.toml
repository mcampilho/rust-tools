[package]
name = "rview"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
description = "A small, fast, portable viewer for PDF, Markdown, HTML, text and CSV documents"
license = "MIT"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
lopdf = { version = "0.47.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT: the built-in Windows PDF renderer and image decoders (nothing to ship).
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06", "async-io"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
# PDF pages and images: what Windows provides, built in on Linux.
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp"] }

[build-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }

[dev-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

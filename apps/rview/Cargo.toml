[package]
name = "rview"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A small, fast, portable viewer for PDF, Markdown, HTML, text and CSV documents"
license = "MIT"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
lopdf = { version = "0.47.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT: the built-in Windows PDF renderer and image decoders (nothing to ship).
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_System_Com",
] }

[build-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }

[dev-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# PDF text reading is rarely on a hot path: these crates are built for size,
# the drawing code keeps opt-level 3.
[profile.release.package.lopdf]
opt-level = "s"
[profile.release.package.nom]
opt-level = "s"
[profile.release.package.brotli-decompressor]
opt-level = "s"
[profile.release.package.aes]
opt-level = "s"
[profile.release.package.sha2]
opt-level = "s"
[profile.release.package.md-5]
opt-level = "s"
[profile.release.package.stringprep]
opt-level = "s"
[profile.release.package.unicode-normalization]
opt-level = "s"
[profile.release.package.rand]
opt-level = "s"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
debug-assertions = false

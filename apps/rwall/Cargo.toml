[package]
name = "rwall"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A portable wallpaper changer in the notification area: Bing, NASA, Wallhaven, Picsum or your own folders"
license = "MIT"

[dependencies]
rt-core = { path = "../../crates/rt-core" }
rt-gfx = { path = "../../crates/rt-gfx" }
rt-sys = { path = "../../crates/rt-sys" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Checking downloaded pictures, the preview, and WebP to PNG for the desktop.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
# The dynamic wallpaper: Media Foundation plays the video into a Direct3D 11
# swap chain behind the desktop icons; nothing to ship. The widgets: layered
# windows, OLE drag and drop for the fences.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] macro of the media engine's callback needs it by name.
windows-core = "0.62"

# X11 and Wayland both: the same executable runs on either.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[build-dependencies]
rt-build = { path = "../../crates/rt-build" }
# build.rs draws the icon with the app's own `src/ui/appicon.rs`.
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[dev-dependencies]
# PNG output for the screenshot test (`cargo test -- --ignored screenshots`).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

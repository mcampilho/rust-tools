[package]
name = "rcalc"
version = "1.2.1"
edition = "2021"
rust-version = "1.88"
description = "A portable, self-contained desktop calculator inspired by Windows Calculator"
license = "MIT"

[dependencies]
rt-core = { path = "../../crates/rt-core" }
rt-gfx = { path = "../../crates/rt-gfx" }
rt-sys = { path = "../../crates/rt-sys" }
rt-ui = { path = "../../crates/rt-ui" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# X11 and Wayland both: the same executable runs on either.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06", "async-io"] }

[build-dependencies]
rt-build = { path = "../../crates/rt-build" }
# build.rs draws the icon with the app's own `src/ui/appicon.rs`.
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[dev-dependencies]
# PNG output for the screenshot test (`cargo test -- --ignored screenshots`).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

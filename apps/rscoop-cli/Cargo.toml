[package]
name = "rscoop-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.93"
description = "A faster Scoop: lists, searches and checks the installation, and hands the other commands to Scoop"
license = "MIT"

[package.metadata.rust-tools]
# Read by dev.ps1 and release.yml. `release` unwinds (catch_unwind), `release-small` aborts.
profile = "release-small"
platforms = "windows"

[dependencies]
rt-core = { path = "../../crates/rt-core" }
rt-cli = { path = "../../crates/rt-cli" }
rt-scoop = { path = "../../crates/rt-scoop" }
# The downloads of `download`.
rt-sys = { path = "../../crates/rt-sys" }
# search and list take regular expressions, as Scoop does.
regex-lite = "0.1"
# Our own cache of what was read from files, and Scoop's own scoop.db.
# Bundled: no SQLite library is needed on the machine.
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

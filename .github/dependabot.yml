# Weekly pull requests for newer crates and actions. Patch and minor updates of
# the crates come in a single pull request; each major version has its own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]
    ignore:
      # Named only for the `#[implement]` macro (rwall): it must be the version the `windows` crate uses, so it is
      # raised by hand together with `windows`, never on its own.
      - dependency-name: windows-core
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup-rust]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

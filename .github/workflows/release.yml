# Builds one tool when its version tag is pushed (rcalc-v1.1.0, rpad-v1.0.0,
# rview-v1.1.0) and publishes it as a GitHub release, with a SHA-256 sum and
# build provenance. Linux is built and tested, but not published yet: most of
# the system integration there is still missing (see the root README).
name: release

on:
  push:
    tags: ["rcalc-v*", "rpad-v*", "rview-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. rview-v1.1.0)"
        required: true
      publish:
        description: "Publish the package in the release (off: only build and test)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Tool, profile and version from the tag
        run: |
          app="${TAG%%-v*}"
          version="${TAG#*-v}"
          declared=$(grep -m1 '^version' "apps/$app/Cargo.toml" | cut -d'"' -f2)
          if [ "$declared" != "$version" ]; then
            echo "::error::apps/$app/Cargo.toml has version $declared but the tag is $TAG"
            exit 1
          fi
          # See the profiles in Cargo.toml: rview needs panics to unwind.
          case "$app" in
            rview) profile=release ;;
            *) profile=release-small ;;
          esac
          {
            echo "APP=$app"
            echo "VERSION=$version"
            echo "PROFILE=$profile"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # build.rs needs rc.exe for the icon and version info, and without it
      # would only warn. The runner has it, but not on PATH.
      - name: Put rc.exe on PATH
        shell: pwsh
        run: |
          $rc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe' |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $rc) { throw 'rc.exe not found' }
          $rc.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Test
        run: cargo test -p "$APP" --locked

      - name: Build
        run: cargo build -p "$APP" --profile "$PROFILE" --locked

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = "target\$env:PROFILE\$env:APP.exe"
          $found = (Get-Item $exe).VersionInfo.ProductVersion
          if ($found -ne $env:VERSION) { throw "$exe has version '$found', expected $env:VERSION" }
          Write-Output "$exe $found, $((Get-Item $exe).Length) bytes"

      - name: Package
        run: |
          dir="$APP-$VERSION-windows-x86_64"
          mkdir "$dir"
          cp "target/$PROFILE/$APP.exe" "$dir"/
          cp "apps/$APP/README.md" "apps/$APP/README.pt.md" LICENSE "$dir"/
          7z a -tzip "$dir.zip" "$dir" > /dev/null
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: ${{ env.ASSET }}

  # Keeps the Linux code compiling and its tests passing. It does not block the
  # release, and it publishes nothing.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p "${TAG%%-v*}" --locked

      - name: Build
        run: cargo build -p "${TAG%%-v*}" --release --locked

  release:
    needs: windows
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256 sum
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="${TAG%%-v*}"
          version="${TAG#*-v}"
          cat > notes.md <<EOF
          Windows 10/11, 64-bit. Unzip and run \`$app.exe\`: there is nothing to install.

          See the [README](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/apps/$app/README.md) ([em português](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/apps/$app/README.pt.md)).
          EOF
          sed -i 's/^ *//' notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$app $version" --notes-file notes.md
          fi

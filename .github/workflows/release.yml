# Builds one tool when its version tag is pushed (rcalc-v1.1.0, rpad-v1.0.0,
# rview-v1.1.0, rsize-v0.1.0, rdup-v0.1.0, rwall-v0.1.0, rpack-v0.1.0, rinst-v0.1.0, rclean-v0.1.0, rcare-v0.1.0, the service rtsvc-v0.1.0, and the command-line apps
# rscoop-cli-v0.1.0, rsize-cli-v0.1.0, rdup-cli-v0.1.0) and publishes it as a GitHub release, with SHA-256
# sums and build provenance, for Windows and Linux. An app that is Windows only says so in its Cargo.toml
# (`platforms = "windows"` under [package.metadata.rust-tools]) and gets no Linux package.
# GitHub starts no workflow when more than three tags are pushed at once: push three at most.
name: release

on:
  push:
    tags: ["rcalc-v*", "rpad-v*", "rview-v*", "rsize-v*", "rdup-v*", "rwall-v*", "rpack-v*", "rinst-v*", "rclean-v*", "rcare-v*", "rtsvc-v*", "rscoop-cli-v*", "rsize-cli-v*", "rdup-cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. rview-v1.1.0)"
        required: true
      publish:
        description: "Publish the package in the release (off: only build and test)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  # Which packages this tag has.
  plan:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.platforms.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Platforms of the tool
        id: platforms
        run: |
          app="${TAG%%-v*}"
          platforms=$(sed -n 's/^platforms *= *"\(.*\)".*/\1/p' "apps/$app/Cargo.toml")
          if [ "$platforms" = windows ]; then echo "linux=false" >> "$GITHUB_OUTPUT"; else echo "linux=true" >> "$GITHUB_OUTPUT"; fi

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Tool, profile and version from the tag
        run: |
          app="${TAG%%-v*}"
          version="${TAG#*-v}"
          declared=$(grep -m1 '^version' "apps/$app/Cargo.toml" | cut -d'"' -f2)
          if [ "$declared" != "$version" ]; then
            echo "::error::apps/$app/Cargo.toml has version $declared but the tag is $TAG"
            exit 1
          fi
          # The profile of each app is in its Cargo.toml ([package.metadata.rust-tools]).
          profile=$(sed -n 's/^profile *= *"\(.*\)".*/\1/p' "apps/$app/Cargo.toml")
          [ -n "$profile" ] || { echo "::error::apps/$app/Cargo.toml has no [package.metadata.rust-tools] profile (a tag from before it cannot be rebuilt)"; exit 1; }
          {
            echo "APP=$app"
            echo "VERSION=$version"
            echo "PROFILE=$profile"
          } >> "$GITHUB_ENV"

      # The Rust version is the one in rust-toolchain.toml; rc.exe is put on PATH.
      - uses: ./.github/actions/setup-rust

      - name: Test
        run: cargo test -p "$APP" --locked

      - name: Build
        run: cargo build -p "$APP" --profile "$PROFILE" --locked

      - name: Check the executable
        shell: pwsh
        run: |
          # The command-line apps have no icon or version resource (no build.rs).
          if (-not (Test-Path "apps/$env:APP/build.rs")) { Write-Output "$env:APP has no version resource (command-line app)"; return }
          $exe = "target\$env:PROFILE\$env:APP.exe"
          $found = (Get-Item $exe).VersionInfo.ProductVersion
          if ($found -ne $env:VERSION) { throw "$exe has version '$found', expected $env:VERSION" }
          Write-Output "$exe $found, $((Get-Item $exe).Length) bytes"

      - name: Package
        run: |
          dir="$APP-$VERSION-windows-x86_64"
          mkdir "$dir"
          cp "target/$PROFILE/$APP.exe" "$dir"/
          cp "apps/$APP/README.md" "apps/$APP/README.pt.md" LICENSE "$dir"/
          7z a -tzip "$dir.zip" "$dir" > /dev/null
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: ${{ env.ASSET }}

  # The oldest runner gives the widest glibc compatibility.
  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Tool and profile from the tag
        run: |
          app="${TAG%%-v*}"
          profile=$(sed -n 's/^profile *= *"\(.*\)".*/\1/p' "apps/$app/Cargo.toml")
          [ -n "$profile" ] || { echo "::error::apps/$app/Cargo.toml has no [package.metadata.rust-tools] profile"; exit 1; }
          {
            echo "APP=$app"
            echo "VERSION=${TAG#*-v}"
            echo "PROFILE=$profile"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-rust

      - name: Test
        run: cargo test -p "$APP" --locked

      - name: Build
        run: cargo build -p "$APP" --profile "$PROFILE" --locked

      - name: Package
        run: |
          dir="$APP-$VERSION-linux-x86_64"
          mkdir "$dir"
          cp "target/$PROFILE/$APP" "$dir"/
          cp "apps/$APP/README.md" "apps/$APP/README.pt.md" LICENSE "$dir"/
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: ${{ env.ASSET }}

  release:
    needs: [windows, linux]
    # A skipped Linux job (a Windows-only tool) does not hold the release back.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result != 'failure' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256 sum
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="${TAG%%-v*}"
          version="${TAG#*-v}"
          {
            if [[ "$app" == rtsvc ]]; then
              echo "Windows service for Windows 10/11, 64-bit, optional: the tools work without it. Unzip it and, from an administrator prompt, run \`rtsvc install\` (\`rtsvc uninstall\` takes it away)."
            elif [[ "$app" == *-cli ]]; then
              echo "Command-line program for Windows 10/11, 64-bit. Unzip it and run \`$app.exe\` from a terminal: there is nothing to install."
            else
              echo "Windows 10/11, 64-bit. Unzip and run \`$app.exe\`: there is nothing to install."
            fi
            if ls dist/*linux* > /dev/null 2>&1; then
              echo
              echo "Linux, x86-64. Extract and run \`./$app\`: see the README for what it needs."
            fi
            echo
            echo "See the [README](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/apps/$app/README.md) ([em português](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/apps/$app/README.pt.md))."
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$app $version" --notes-file notes.md
          fi

# Checks every push to master and every pull request: clippy without
# warnings and all the tests of the workspace, on Windows and Linux; that the
# oldest Rust the crates declare still compiles them; and that no dependency
# has a known security advisory. Releases are built by release.yml.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Advisories appear without anyone pushing.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The Linux runner is the one the releases are built on.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The version is the one in rust-toolchain.toml.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The code follows rustfmt (rustfmt.toml). Run `cargo fmt --all` before a commit.
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  # `rust-version` in the Cargo.toml files is a promise: build with it.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Oldest version the crates declare
        id: msrv
        shell: bash
        run: |
          v=$(grep -h '^rust-version' apps/*/Cargo.toml crates/*/Cargo.toml | cut -d'"' -f2 | sort -V | tail -1)
          [ -n "$v" ] || { echo "::error::no rust-version found"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check
        run: cargo check --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
